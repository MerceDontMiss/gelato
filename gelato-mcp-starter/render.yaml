services:
  - type: web
    name: gelato-readonly-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: GELATO_API_KEY
        sync: false
      - key: MCP_BEARER_TOKEN
        sync: false
